name: Analyst dependency verification

on:
  pull_request:
    branches: [main]
    paths:
      - analyst/**
      - .github/workflows/analyst-ci.yml
  push:
    branches: [main]
    paths:
      - analyst/**
      - .github/workflows/analyst-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analyst/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
